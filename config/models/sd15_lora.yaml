# Stable Diffusion 1.5 source-conditioned editing backbone.
model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
vae_id: null
adapter_type: lora
rank: 16
alpha: 16.0
dropout: 0.0
target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
source_conditioning: concat
use_age_delta_conditioning: true
age_conditioning_mode: delta_mlp
use_age_conditioner_v2: true
age_conditioning_version: v2_fourier
age_delta_scale: 80.0
age_condition_hidden_dim: 256
age_condition_output_dim: null
num_fourier_frequencies: 8
age_condition_use_raw_scalars: true
age_condition_use_gate: true
device: auto
dtype: auto
local_files_only: false
revision: null
variant: null

# Frozen differentiable training auxiliaries. MiVOLO executes repository-defined
# Transformers code, so pin age_revision for long-lived production experiments.
load_auxiliary_models: true
identity_model_id: py-feat/arcface_r50
age_model_id: iitolstykh/mivolo_v2
auxiliary_dtype: null
identity_revision: null
age_revision: null
auxiliary_cache_dir: null
auxiliary_trust_remote_code: true
auxiliary_activation_checkpointing: true
verbose: true
