# Conservative defaults intended to preserve the source photograph.
num_epochs: 10
max_train_steps: null
lr_lora: 3.0e-5
lr_conv_in: 5.0e-6
lr_age_conditioner: 1.0e-4
weight_decay: 1.0e-2
conv_in_weight_decay: 1.0e-2
age_conditioner_weight_decay: 1.0e-2
use_age_delta_conditioning: true
age_conditioning_mode: delta_mlp
use_age_conditioner_v2: true
age_conditioning_version: v2_fourier
age_delta_scale: 80.0
use_relative_age_loss: true
relative_age_weight: 0.05
relative_age_loss_type: l1
use_preservation_loss: true
preservation_weight: 0.10
preservation_loss_type: l1
preservation_max_delta: 2
use_small_delta_weighting: true
small_delta_threshold: 5
small_delta_weight: 2.0
# Must agree with the training loader. 0.20 means an 80/20 forward/reverse
# ordering among non-self observations; it does not truncate forward pairs.
use_bidirectional_training: true
reverse_pair_prob: 0.20
warmup_ratio: 0.05
min_lr_ratio: 0.10
grad_accum_steps: 4
max_grad_norm: 1.0
amp_enabled: true
amp_dtype: auto
gradient_checkpointing: true
enable_xformers: true
conditioning_dropout_prob: 0.05
target_prompt_policy: mixed
generic_prompt_prob: 0.30
numeric_prompt_prob: 0.70
timestep_sampling: uniform
min_train_timestep: 0
max_train_timestep: null
sample_source_posterior: false
sample_target_posterior: true
noise_offset: 0.0
min_snr_gamma: 5.0
auxiliary_max_timestep: 400
checkpoint_dir: checkpoints/face_aging
save_every_epochs: 1
save_epoch_checkpoints: true
max_epoch_checkpoints: 5
resume_from: null
validate_every_epochs: 1
deterministic_validation: true
validation_seed: 2026
sample_every_epochs: 1
monitoring_compute_diagnostics: true
monitoring_image: null
monitoring_target_age: [16, 18, 24, 30, 35, 40, 50, 65]
monitoring_source_age: null  # required when monitoring_image is supplied
monitoring_use_inverse_diffusion: false
monitoring_num_inference_steps: 30
monitoring_strength: 0.35
monitoring_strength_multi: [0.20, 0.27, 0.35, 0.40]
monitoring_use_delta_dependent_strength: false
monitoring_base_strength: 0.18
monitoring_strength_per_year: 0.005
monitoring_min_strength: 0.18
monitoring_max_strength: 0.40
monitoring_text_reference_mode: source_age
monitoring_age_guidance_scale: 3.0
monitoring_seed: 2026
log_every: 25
seed: 42
deterministic: false
device: auto

# Frozen ArcFace and MiVOLO losses run every fourth training microbatch on 25% of
# eligible samples. This bounds activation memory while retaining regularization.
loss:
  diffusion_weight: 1.0
  identity_weight: 0.20
  age_weight: 0.05
  use_relative_age_loss: true
  relative_age_weight: 0.05
  relative_age_loss_type: l1
  use_directional_relative_weighting: false
  reverse_relative_weight: 1.25
  use_preservation_loss: true
  preservation_weight: 0.10
  preservation_loss_type: l1
  preservation_max_delta: 2
  use_small_delta_weighting: true
  small_delta_threshold: 5
  small_delta_weight: 2.0
  source_age_prediction_mode: age_estimator
  identity_reference: target
  diffusion_loss_type: mse
  age_loss_type: l1
  min_snr_gamma: 5.0
  auxiliary_every_n_steps: 4
  auxiliary_sample_fraction: 0.25
  auxiliary_max_timestep: 400
  auxiliary_seed: 42
  clamp_pred_x0: true
  check_finite: true
  vae_decode_checkpointing: true
