# Conservative defaults intended to preserve the source photograph.
num_epochs: 10
max_train_steps: null
lr_lora: 5.0e-5
lr_conv_in: 1.0e-5
weight_decay: 1.0e-2
conv_in_weight_decay: 1.0e-2
warmup_ratio: 0.05
min_lr_ratio: 0.10
grad_accum_steps: 4
max_grad_norm: 1.0
amp_enabled: true
amp_dtype: auto
gradient_checkpointing: true
enable_xformers: true
conditioning_dropout_prob: 0.05
timestep_sampling: uniform
min_train_timestep: 0
max_train_timestep: null
sample_source_posterior: false
sample_target_posterior: true
noise_offset: 0.0
min_snr_gamma: 5.0
checkpoint_dir: checkpoints/face_aging
save_every_epochs: 1
save_epoch_checkpoints: true
max_epoch_checkpoints: 5
resume_from: null
validate_every_epochs: 1
deterministic_validation: true
validation_seed: 2026
sample_every_epochs: 1
monitoring_image: null
monitoring_target_age: 65
monitoring_use_inverse_diffusion: true
monitoring_num_inference_steps: 30
monitoring_strength: 0.45
monitoring_seed: 2026
log_every: 25
seed: 42
deterministic: false
device: auto

# The CLI baseline is immediately runnable without external auxiliary networks.
# Set these above zero from Python after supplying IdentityEncoderAdapter and
# AgeEstimatorAdapter instances, as demonstrated in notebooks/training.ipynb.
loss:
  diffusion_weight: 1.0
  identity_weight: 0.0
  age_weight: 0.0
  identity_reference: target
  diffusion_loss_type: mse
  age_loss_type: l1
  min_snr_gamma: 5.0
  auxiliary_every_n_steps: 1
  auxiliary_sample_fraction: 1.0
  auxiliary_max_timestep: null
  auxiliary_seed: 42
  clamp_pred_x0: true
  check_finite: true
