[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longitudinal-face-aging"
version = "0.1.0"
description = "Supervised longitudinal face-aging with Stable Diffusion 1.5 and LoRA."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Longitudinal Face Aging contributors" }]
keywords = ["diffusion", "face-aging", "pytorch", "lora", "computer-vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1,<3",
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "diffusers>=0.30,<1",
  "transformers>=4.40,<5",
  "accelerate>=0.30,<2",
  "safetensors>=0.4,<1",
  "huggingface-hub>=0.23,<1",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<7", "matplotlib>=3.8,<4"]
auxiliary = [
  "py-feat>=2.1.1; python_version >= '3.11'",
  "mivolo @ git+https://github.com/WildChlamydia/MiVOLO.git@main",
  "transformers>=4.51,<5",
  "accelerate>=1.8.1,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "tomli>=2; python_version < '3.11'",
]
xformers = ["xformers>=0.0.27"]

[project.scripts]
aging-data = "scripts.prepare_data:main"
aging-train = "scripts.train:main"
aging-infer = "scripts.infer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["notebooks", "planing"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
